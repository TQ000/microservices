spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/order-db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8081
clients:
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8082}
    request-timeout: ${INVENTORY_REQUEST_TIMEOUT:5s}
