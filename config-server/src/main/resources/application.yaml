spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:${user.dir}/../../ecommerce-config}
          username: ${CONFIG_GIT_USERNAME:}
          password: ${CONFIG_GIT_TOKEN:}
          clone-on-start: true
          default-label: ${CONFIG_GIT_LABEL:main}
server:
  address: ${CONFIG_SERVER_BIND_ADDRESS:127.0.0.1}
  port: 8888
